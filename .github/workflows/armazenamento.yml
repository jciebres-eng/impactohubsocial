name: armazenamento
# Executado À MÃO: Actions → armazenamento → Run workflow. Verifica o BUCKET REAL (Cloudflare R2) com o
# mesmo adaptador que a aplicação usa: PUT, GET, URL pré-assinada, expiração, assinatura adulterada,
# credencial errada, DELETE. Grava só sob `_smoke/` e apaga ao fim. Não imprime chave nem URL assinada.
#
# SEGREDOS por ambiente (Settings → Environments → staging / production → secrets):
#   R2_ENDPOINT           https://<ACCOUNT_ID>.r2.cloudflarestorage.com   (não é segredo, mas fica junto)
#   R2_BUCKET             nome do bucket PRIVADO daquele ambiente
#   R2_ACCESS_KEY_ID      token R2 restrito a esse bucket (Object Read & Write)
#   R2_SECRET_ACCESS_KEY
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: "ambiente cujos segredos R2 usar"
        type: choice
        options: [staging, production]
        default: staging
permissions: { contents: read }
concurrency:
  group: armazenamento-${{ inputs.ambiente }}
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.ambiente }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (resolvida em 2026-10-10 por git ls-remote)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (resolvida em 2026-10-10 por git ls-remote)
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - name: Segredos cadastrados?
        env:
          E: ${{ secrets.R2_ENDPOINT }}
          B: ${{ secrets.R2_BUCKET }}
          K: ${{ secrets.R2_ACCESS_KEY_ID }}
          S: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          falta=""
          [ -n "$E" ] || falta="$falta R2_ENDPOINT"; [ -n "$B" ] || falta="$falta R2_BUCKET"
          [ -n "$K" ] || falta="$falta R2_ACCESS_KEY_ID"; [ -n "$S" ] || falta="$falta R2_SECRET_ACCESS_KEY"
          [ -z "$falta" ] || { echo "::error title=Segredos ausentes no ambiente ${{ inputs.ambiente }}::$falta"; exit 1; }
      - name: Bucket real
        env:
          S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          S3_REGION: auto
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          python3 scripts/storage_smoke.py --json resultado.json | tee saida.txt
          echo "::notice title=Armazenamento (${{ inputs.ambiente }})::$(grep -E 'PASS|FAIL|AVISO|VEREDITO' saida.txt | sed 's/^ *//' | paste -sd'|' -)"
