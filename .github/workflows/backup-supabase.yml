name: backup-supabase
# CÓPIA EXTERNA DIÁRIA DO BANCO DE PRODUÇÃO (Supabase → Cloudflare R2), cifrada.
#
# Por que existe: o Supabase Pro guarda backups diários por 7 dias, mas DENTRO do próprio Supabase.
# Um incidente na conta, um erro humano descoberto depois de uma semana ou a perda do projeto levam
# o banco e os backups juntos. Esta cópia fica em outro provedor (R2), em bucket separado do bucket
# de arquivos da aplicação, e é cifrada antes de sair do runner — o dump contém dados pessoais (LGPD).
#
# Por que no GitHub e não no worker: a rotina `backup` do worker usa o pg_dump da imagem (Debian
# bookworm = PostgreSQL 15), que recusa servidor 17 (Supabase). Aqui instalamos o cliente 17.
#
# SEGREDOS (Settings → Secrets and variables → Actions):
#   SUPABASE_ADMIN_URL           string do POOLER DE SESSÃO (Supabase → Connect → Session pooler).
#                                O GitHub Actions não tem IPv6; a conexão direta db.<ref>.supabase.co é IPv6.
#   R2_BACKUP_ACCESS_KEY_ID      token R2 com "Object Read & Write" SÓ no bucket impacto-backups.
#   R2_BACKUP_SECRET_ACCESS_KEY  idem (chave secreta).
#   BACKUP_PASSPHRASE            frase longa (≥ 32 caracteres) que cifra o arquivo. Guarde-a num
#                                gerenciador de senhas: SEM ELA O BACKUP NÃO PODE SER RESTAURADO.
#
# RETENÇÃO: regra de ciclo de vida no bucket (Cloudflare → R2 → impacto-backups → Settings →
# Object lifecycle rules): apagar objetos com mais de 30 dias.
#
# CIFRA (v0.35.0, auditoria BCP-01): AUTENTICADA — AES-256-GCM em blocos, chave por scrypt a partir da MESMA
# BACKUP_PASSPHRASE (scripts/backup_crypt.py, formato `.dump.aead`). Arquivo alterado, truncado ou com frase errada
# FALHA ao decifrar em vez de devolver dado errado. O SHA-256 vai também para o resumo da execução (fora do bucket).
# Os `.dump.enc` antigos (openssl, sem autenticação) continuam legíveis até a retenção de 30 dias apagá-los.
#
# RESTAURAR (num banco novo/vazio, nunca por cima da produção sem decisão):
#   aws s3 cp s3://impacto-backups/supabase/<arquivo>.dump.aead . --endpoint-url "$R2_ENDPOINT"
#   pip install cryptography==50.0.1 && python3 scripts/backup_crypt.py decrypt <arquivo>.dump.aead impacto.dump
#   (arquivo antigo .dump.enc: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_PASSPHRASE -in <arquivo>.dump.enc -out impacto.dump)
#   DUMP_FILE=impacto.dump SOURCE_DATABASE_URL=<produção, só leitura> TARGET_ADMIN_URL=<banco NOVO> \
#     bash scripts/managed_backup_restore.sh
#   (v0.32.0) Um `pg_restore` direto num banco novo FALHA: o dump só de `public` não leva as extensões
#   (`pgcrypto` no schema `extensions`, `citext`, `unaccent`, `pg_trgm`) e traz um `CREATE SCHEMA public`
#   que colide. O script recria as extensões no schema certo, pula essa entrada e roda os verificadores.
#
# ENSAIO DE RESTAURAÇÃO (v0.32.0): todo dia 1º e à mão (modo `ensaio-restauracao`) — baixa o backup mais
# recente do R2, confere o SHA-256, decifra e restaura num PostgreSQL 17 DESCARTÁVEL deste job, com os
# verificadores de integridade. Backup que ninguém restaurou não prova nada.

on:
  schedule:
    - cron: "17 6 * * *"   # todo dia às 06:17 UTC (03:17 em Brasília, 02:17 em Cuiabá)
    - cron: "47 7 1 * *"   # dia 1º de cada mês, 07:47 UTC: ensaio de restauração
  workflow_dispatch:
    inputs:
      modo:
        description: "backup (cópia nova) ou ensaio-restauracao (restaura o backup mais recente num banco descartável)"
        type: choice
        options: [backup, ensaio-restauracao]
        default: backup

permissions: { contents: read }
concurrency: { group: backup-supabase, cancel-in-progress: false }

jobs:
  backup:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.modo != 'ensaio-restauracao')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      R2_ENDPOINT: https://a3be721284ccd50cd9a7514140f7b85a.r2.cloudflarestorage.com
      R2_BUCKET: impacto-backups
    steps:
      - name: Segredos cadastrados?
        env:
          ADMIN: ${{ secrets.SUPABASE_ADMIN_URL }}
          KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          KEY_SECRET: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          falta=0
          test -n "$ADMIN"      || { echo "::error title=Segredo ausente::SUPABASE_ADMIN_URL"; falta=1; }
          test -n "$KEY_ID"     || { echo "::error title=Segredo ausente::R2_BACKUP_ACCESS_KEY_ID"; falta=1; }
          test -n "$KEY_SECRET" || { echo "::error title=Segredo ausente::R2_BACKUP_SECRET_ACCESS_KEY"; falta=1; }
          test -n "$PASSPHRASE" || { echo "::error title=Segredo ausente::BACKUP_PASSPHRASE"; falta=1; }
          if [ -n "$PASSPHRASE" ] && [ "${#PASSPHRASE}" -lt 32 ]; then
            echo "::error title=Frase curta::BACKUP_PASSPHRASE precisa de pelo menos 32 caracteres"; falta=1
          fi
          exit $falta

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (resolvida em 2026-10-10 por git ls-remote) — scripts/backup_crypt.py (v0.35.0)
      - name: Cliente PostgreSQL 17 e biblioteca de cifra
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          python3 -m pip install --quiet "cryptography==50.0.1"   # a mesma versão de backend/requirements.txt

      - name: Dump do esquema da aplicação
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_ADMIN_URL }}
        run: |
          set -euo pipefail
          # Só o esquema `public` (o da aplicação). Os esquemas internos do Supabase (auth, storage,
          # realtime…) não são da plataforma e o usuário administrativo não tem como despejá-los.
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" \
            --schema=public --format=custom --compress=9 --no-owner --no-privileges \
            --file=impacto.dump
          # O arquivo precisa ser legível pelo pg_restore antes de ser enviado: um dump truncado
          # que "subiu com sucesso" é pior que backup nenhum, porque ninguém desconfia dele.
          objetos=$(/usr/lib/postgresql/17/bin/pg_restore --list impacto.dump | grep -vc '^;')
          echo "objetos no dump: $objetos"
          test "$objetos" -gt 100 || { echo "::error title=Dump suspeito::só $objetos objetos"; exit 1; }
          ls -l impacto.dump

      - name: Cifrar (autenticada)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          ARQ="impacto-$TS.dump.aead"
          echo "ARQ=$ARQ" >> "$GITHUB_ENV"
          python3 scripts/backup_crypt.py encrypt impacto.dump "$ARQ"
          # Prova de que a frase abre o arquivo — e de que a autenticação confere — antes de apagar o original.
          python3 scripts/backup_crypt.py decrypt "$ARQ" conferencia.dump
          cmp conferencia.dump impacto.dump
          sha256sum "$ARQ" > "$ARQ.sha256"
          # O hash também FORA do bucket: quem alterasse o backup no R2 teria de alterar este resumo também.
          echo "SHA-256 de \`$ARQ\`: \`$(cut -d' ' -f1 "$ARQ.sha256")\`" >> "$GITHUB_STEP_SUMMARY"
          rm -f impacto.dump conferencia.dump

      - name: Enviar para o R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          aws s3 cp "$ARQ"        "s3://$R2_BUCKET/supabase/$ARQ"        --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 cp "$ARQ.sha256" "s3://$R2_BUCKET/supabase/$ARQ.sha256" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 ls "s3://$R2_BUCKET/supabase/$ARQ" --endpoint-url "$R2_ENDPOINT"
          echo "### Backup enviado: \`supabase/$ARQ\`" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$ARQ" "$ARQ.sha256"

  ensaio-restauracao:
    if: (github.event_name == 'schedule' && github.event.schedule == '47 7 1 * *') || (github.event_name == 'workflow_dispatch' && inputs.modo == 'ensaio-restauracao')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      alvo:   # PostgreSQL DESCARTÁVEL: morre com o job.
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      R2_ENDPOINT: https://a3be721284ccd50cd9a7514140f7b85a.r2.cloudflarestorage.com
      R2_BUCKET: impacto-backups
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (resolvida em 2026-10-10 por git ls-remote)
      - name: Cliente PostgreSQL 17 e biblioteca de cifra
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          python3 -m pip install --quiet "cryptography==50.0.1"
      - name: Baixar o backup mais recente e conferir o hash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          # v0.35.0: o mais recente entre o formato novo (.dump.aead) e o antigo (.dump.enc) — o nome começa pela data.
          ARQ=$(aws s3 ls "s3://$R2_BUCKET/supabase/" --endpoint-url "$R2_ENDPOINT" | awk '{print $4}' | grep -E '\.dump\.(aead|enc)$' | sort | tail -1)
          test -n "$ARQ" || { echo "::error title=Sem backup::nenhum .dump.aead/.dump.enc em supabase/"; exit 1; }
          aws s3 cp "s3://$R2_BUCKET/supabase/$ARQ"        . --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 cp "s3://$R2_BUCKET/supabase/$ARQ.sha256" . --endpoint-url "$R2_ENDPOINT" --only-show-errors
          sha256sum -c "$ARQ.sha256"
          echo "ARQ=$ARQ" >> "$GITHUB_ENV"
          echo "### Backup ensaiado: \`supabase/$ARQ\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Decifrar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          case "$ARQ" in
            *.dump.aead) python3 scripts/backup_crypt.py decrypt "$ARQ" impacto.dump
                         echo "Formato: AEAD (autenticado — arquivo íntegro e frase correta, conferidos)" >> "$GITHUB_STEP_SUMMARY" ;;
            *.dump.enc)  openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_PASSPHRASE -in "$ARQ" -out impacto.dump
                         echo "Formato: antigo (openssl CBC, sem autenticação — só o SHA-256 confere)" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          rm -f "$ARQ" "$ARQ.sha256"
      - name: Restaurar num banco descartável e verificar
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SUPABASE_ADMIN_URL }}
          TARGET_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
          DUMP_FILE: impacto.dump
        run: |
          set -o pipefail
          bash scripts/managed_backup_restore.sh 2>&1 | tee resultado.txt
          grep -q '^BACKUP_RESTORE_OK$' resultado.txt
          echo "::notice title=Ensaio de restauração ($ARQ)::$(grep '^\[backup-restore\]' resultado.txt | sed 's/^\[backup-restore\] //' | paste -sd'|' -)"
          { echo "## Ensaio de restauração"; grep -v '^NOTICE' resultado.txt | sed 's/^/    /'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Nada sai deste job
        if: always()
        run: rm -f impacto.dump resultado.txt
