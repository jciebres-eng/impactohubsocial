name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:   # v0.31.0: validar um branch de trabalho sem publicá-lo no main (o Railway publica o main)
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # a varredura de segredo precisa do histórico
      # VARREDURA DE SEGREDO. Até a v0.22.0 não havia nenhuma, em lugar nenhum: nem no CI, nem em
      # pre-commit, nem na suíte. O fail-fast de `config.py` recusa subir sem segredo configurado —
      # isso protege o BOOT, não o histórico do git. Um segredo commitado por engano ficava lá.
      #
      # A ACTION `gitleaks/gitleaks-action` exige licença paga (GITLEAKS_LICENSE) em conta de
      # organização, e falhava em TODO push — antes de qualquer outro passo. A suíte de testes
      # nunca chegou a rodar no GitHub por causa disso. O BINÁRIO do gitleaks é livre (MIT): mesma
      # varredura, sem a action. Versão fixada; o tarball é conferido contra o arquivo de checksums
      # oficial da MESMA release (íntegro em trânsito — não protege contra release comprometida).
      - name: Varredura de segredo (gitleaks, binário oficial fixado)
        id: gitleaks
        env: { GITLEAKS_VERSION: "8.30.1" }
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -fsSLO "$base/$tgz"
          curl -fsSLO "$base/$sums"
          grep " ${tgz}\$" "$sums" | sha256sum -c -
          tar -xzf "$tgz" gitleaks
          ./gitleaks git --redact --no-banner --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" .
      - name: Achados do gitleaks como anotação
        if: failure() && steps.gitleaks.outcome == 'failure'
        run: python3 scripts/ci_annotate_gitleaks.py "$RUNNER_TEMP/gitleaks.json"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update && sudo apt-get install -y libpq5 postgresql-client tesseract-ocr
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        run: cd backend && ruff check impacto
      - name: Frontend — dependências, typecheck (tipos oficiais) e build
        run: |
          cd web
          # v0.24.0: o lockfile está versionado (D-SUP1 parcialmente fechado), então é `npm ci` —
          # instala EXATAMENTE a árvore travada, com integridade conferida, e falha se o
          # package.json divergir do lockfile. Esta é a primeira execução que prova que o lockfile
          # instala; o ambiente de desenvolvimento não alcança o registro.
          # Sem lockfile, `npm ci` falharia de qualquer jeito; o teste explícito diz POR QUÊ, e
          # garante que o `npm audit` mais abaixo audita a mesma árvore que foi construída.
          test -f package-lock.json || { echo "web/package-lock.json ausente: a árvore auditada não seria a construída"; exit 1; }
          npm ci --no-audit
          npx tsc -p tsconfig.json --noEmit
          node build.mjs
      - run: python -m playwright install --with-deps chromium
      - name: Testes (unit, integração, segurança/RLS, OIDC, E2E navegador)
        id: testes
        run: |
          set -o pipefail
          cd backend && python -m unittest discover -s tests -t . -v 2>&1 | tee "$RUNNER_TEMP/testes.log"
      # O log bruto do Actions não é legível de fora do navegador do GitHub; anotações são (API).
      - name: Falhas da suíte como anotação
        if: failure() && steps.testes.outcome == 'failure'
        run: python3 scripts/ci_annotate_failures.py "$RUNNER_TEMP/testes.log"
      - name: Backup e RESTAURAÇÃO conferida (ciclo completo)
        if: always() && steps.testes.outcome != 'skipped'
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DB_NAME: impacto_restore_ci
          OWNER_PASSWORD: owner_ci_pw
        run: |
          set -euo pipefail
          # Banco novo com os papéis reais (impacto_owner/impacto_app) e todas as migrations.
          bash scripts/dev_reset_db.sh
          export BACKUP_DATABASE_URL="postgresql://impacto_owner:$OWNER_PASSWORD@localhost:5432/$DB_NAME"
          bash scripts/backup.sh "${{ runner.temp }}/backups"
          DUMP=$(ls -t "${{ runner.temp }}"/backups/impacto-*.dump | head -1)
          bash scripts/restore_test.sh "$DUMP"
          # Um restore que confere o hash de um dump que ninguém alterou prova pouco. Aqui o dump é
          # corrompido de propósito: o teste TEM de falhar. Se passar, a verificação é decorativa.
          cp "$DUMP" "$DUMP.adulterado"; printf 'x' >> "$DUMP.adulterado"
          cp "$DUMP.sha256" "$DUMP.adulterado.sha256"
          sed -i "s|$(basename "$DUMP")|$(basename "$DUMP").adulterado|" "$DUMP.adulterado.sha256"
          if bash scripts/restore_test.sh "$DUMP.adulterado" 2>/dev/null; then
            echo "FALHA: restore_test.sh aceitou um dump adulterado"; exit 1
          fi
          echo "restore_test.sh recusa dump adulterado, como deve"
  # AUDITORIA DE VULNERABILIDADES em job próprio: resposta em ~1 min, sem esperar a suíte (~15 min),
  # e sem ser escondida por ela. Nunca tinha rodado até a v0.24.1 — e achou vulnerabilidades reais.
  # ARMAZENAMENTO (v0.31.0): o adaptador S3 do produto contra um servidor S3 que VALIDA assinatura
  # (MinIO, versão fixada). Até aqui a assinatura só era conferida contra o vetor de teste da AWS; nunca
  # tinha falado com um servidor. Não prova o R2 — isso é o workflow `armazenamento`, com o bucket real.
  armazenamento:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - name: MinIO descartável
        run: |
          # Primeira referência que existir, em ordem; a usada e o digest dela vão para o log e o resumo.
          for img in quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z minio/minio:RELEASE.2025-04-22T22-12-26Z \
                     minio/minio:RELEASE.2024-10-13T13-34-11Z quay.io/minio/minio:latest minio/minio:latest; do
            if docker pull -q "$img" 2>pull.err; then usada="$img"; break; fi
            echo "::warning title=pull falhou::$img — $(tail -c 300 pull.err | tr "\n" " ")"
          done
          test -n "${usada:-}" || { echo "::error::nenhuma imagem do MinIO disponível"; exit 1; }
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$usada")
          echo "::notice title=Servidor S3 de teste::$usada ($digest)"
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=impactoteste -e MINIO_ROOT_PASSWORD=impactoteste-descartavel \
            "$usada" server /data
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
      - name: Adaptador S3 contra servidor real (assinatura, URL pré-assinada, expiração, adulteração, exclusão)
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_BUCKET: impacto-teste
          S3_TEST_ACCESS_KEY_ID: impactoteste
          S3_TEST_SECRET_ACCESS_KEY: impactoteste-descartavel
        run: cd backend && python -m unittest tests.test_v0310_storage -v

  auditoria:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install pip-audit
      - name: Auditoria de vulnerabilidades (pip-audit + npm audit)
        run: |
          set +e
          pip-audit -r backend/requirements.txt -r backend/requirements-optional.txt -f json -o "$RUNNER_TEMP/pip-audit.json"; py=$?
          (cd web && npm audit --omit=dev --audit-level=high --json > "$RUNNER_TEMP/npm-audit.json"); js=$?
          python3 scripts/ci_annotate_audit.py "$RUNNER_TEMP/pip-audit.json" "$RUNNER_TEMP/npm-audit.json"
          echo "pip-audit saiu com $py; npm audit saiu com $js"
          [ "$py" -eq 0 ] && [ "$js" -eq 0 ]
  # Sem `needs: backend`: a imagem construir é uma prova independente de a suíte passar. Com a
  # dependência, qualquer teste quebrado escondia se o Dockerfile funcionava — e escondeu, em todo
  # push até a v0.24.0 (o job aparecia como "skipped").
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t impacto:${{ github.sha }} .
      - name: Configuração de produção recusa segredos ausentes (fail-fast)
        run: |
          ! docker run --rm -e IMPACTO_ENV=production -e DATABASE_URL=postgresql://x@y/z impacto:${{ github.sha }} python3 -c "from impacto.config import load_settings; load_settings()"
  # PILHA DO ZERO (v0.25.0). O critério de "funciona" desta versão é ponta a ponta: banco VAZIO com o
  # desenho do Supabase (administrador sem superusuário, pgcrypto em `extensions`) → imagem do
  # produto → bootstrap do impacto_app → migrações → seed de demonstração → aplicação como
  # impacto_app → as 13 jornadas pela API → as 218 telas no navegador, com cada perfil → reinício da
  # aplicação → os dados continuam lá. Nada aqui usa o servidor de teste: é o mesmo artefato que iria
  # para um servidor. Segredos gerados na hora, mascarados, descartados com a máquina.
  pilha-do-zero:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libpq5
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Segredos descartáveis desta execução
        run: |
          set -euo pipefail
          gera() { python3 -c "import secrets;print(secrets.token_urlsafe(24))"; }
          SUPER=$(gera); ADMIN=$(gera); APP=$(gera); DEMO="Demo-$(gera)"
          TOTP=$(python3 -c "import base64,os;print(base64.b32encode(os.urandom(20)).decode())")
          for v in "$SUPER" "$ADMIN" "$APP" "$DEMO" "$TOTP"; do echo "::add-mask::$v"; done
          printf 'POSTGRES_SUPERUSER_PASSWORD=%s\nIMPACTO_ADMIN_PASSWORD=%s\nIMPACTO_APP_PASSWORD=%s\nDEMO_PASSWORD=%s\nDEMO_TOTP_SECRET=%s\n' \
            "$SUPER" "$ADMIN" "$APP" "$DEMO" "$TOTP" > infra/compose/demo/.env
          { echo "DEMO_PASSWORD=$DEMO"; echo "DEMO_TOTP_SECRET=$TOTP"; echo "STACK_DSN=postgresql://impacto_admin:$ADMIN@127.0.0.1:5432/impacto"; } >> "$GITHUB_ENV"
      - name: docker compose up (banco vazio → imagem → migrações → seed → aplicação)
        run: |
          set -euo pipefail
          mkdir -p dist-stack/data && chmod 777 dist-stack/data
          docker compose -f infra/compose/demo/compose.yml --env-file infra/compose/demo/.env up -d --build
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1 && break
            sleep 3
          done
          curl -fsS http://127.0.0.1:8080/readyz
          docker compose -f infra/compose/demo/compose.yml logs app | grep "impacto-start" || true
      # axe-core com versão FIXADA, baixado do registro npm (o ambiente de desenvolvimento não alcança
      # o registro; o CI alcança). `npm pack` confere a integridade publicada no registro.
      - name: axe-core 4.10.2 (auditoria WCAG A/AA)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP" && npm pack axe-core@4.10.2 >/dev/null && tar -xzf axe-core-4.10.2.tgz package/axe.min.js
          echo "AXE_JS=$RUNNER_TEMP/package/axe.min.js" >> "$GITHUB_ENV"
      - name: Jornadas (API), 218 telas (navegador) e axe, com cada perfil de demonstração
        run: python3 scripts/demo_stack.py --base http://127.0.0.1:8080 --outbox dist-stack/data/outbox --dsn "$STACK_DSN" --telas --axe "$AXE_JS" --axe-trava --saida dist-stack/out
      - name: Persistência — reinicia a aplicação e confere que os dados continuam
        run: |
          set -euo pipefail
          antes=$(python3 scripts/stack_persistence.py --base http://127.0.0.1:8080 contar)
          docker compose -f infra/compose/demo/compose.yml restart app
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1 && break; sleep 3; done
          depois=$(python3 scripts/stack_persistence.py --base http://127.0.0.1:8080 contar)
          echo "antes: $antes · depois: $depois"
          test "$antes" = "$depois"
      - name: Evidência da pilha (relatórios de jornadas e telas)
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: pilha-do-zero, path: dist-stack/out, if-no-files-found: warn }
      - name: Registro da aplicação em caso de falha
        if: failure()
        run: docker compose -f infra/compose/demo/compose.yml logs --tail 200 app db
      - name: Derruba a pilha
        if: always()
        run: docker compose -f infra/compose/demo/compose.yml --env-file infra/compose/demo/.env down -v
