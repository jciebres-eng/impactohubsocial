[project]
name = "impacto-backend"
version = "0.12.1"
description = "Plataforma Impacto — API (Starlette) sobre PostgreSQL com RLS"
requires-python = ">=3.11"

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "S", "UP"]
ignore = ["S101", "S608", "E501", "B008"]   # S608: SQL montado só com identificadores de listas fixas (teste de arquitetura cobre)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "E702", "E731", "E741", "S110", "S310", "S603", "S607", "S105", "S106", "S107", "B905", "F841", "B007"]   # código de teste: asserções amplas, subprocessos controlados, credenciais fictícias
