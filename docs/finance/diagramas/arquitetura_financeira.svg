<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720"><rect width="1180" height="720" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#444"/></marker></defs><text x="20" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#1f3864">Arquitetura financeira do IMPACTO (v0.34.0) — a plataforma SABE e DIZ; nunca GUARDA</text><rect x="20" y="60" width="260" height="130" rx="8" fill="#f5f7fb" stroke="#1f3864" stroke-width="1.5"/><text x="30" y="82" font-family="Arial" font-size="14" font-weight="bold" fill="#1f3864">Doador / Financiador</text><text x="30" y="102" font-family="Arial" font-size="12" fill="#222">paga ao PROVEDOR (Pix/cartão)</text><text x="30" y="118" font-family="Arial" font-size="12" fill="#222">vê preço total antes de pagar</text><text x="30" y="134" font-family="Arial" font-size="12" fill="#222">doação pública ou anônima</text><text x="30" y="150" font-family="Arial" font-size="12" fill="#222">compromisso ≠ dinheiro</text><rect x="20" y="230" width="260" height="130" rx="8" fill="#f5f7fb" stroke="#1f3864" stroke-width="1.5"/><text x="30" y="252" font-family="Arial" font-size="14" font-weight="bold" fill="#1f3864">Organização beneficiária</text><text x="30" y="272" font-family="Arial" font-size="12" fill="#222">recebe do provedor (não da plataforma)</text><text x="30" y="288" font-family="Arial" font-size="12" fill="#222">declara gastos e recursos externos</text><text x="30" y="304" font-family="Arial" font-size="12" fill="#222">prestação de contas NUNCA bloqueada</text><text x="30" y="320" font-family="Arial" font-size="12" fill="#222">paga taxa de serviço À PARTE (se devida)</text><rect x="20" y="400" width="260" height="130" rx="8" fill="#f5f7fb" stroke="#1f3864" stroke-width="1.5"/><text x="30" y="422" font-family="Arial" font-size="14" font-weight="bold" fill="#1f3864">Provedor de pagamento</text><text x="30" y="442" font-family="Arial" font-size="12" fill="#222">só SANDBOX nesta versão</text><text x="30" y="458" font-family="Arial" font-size="12" fill="#222">cobrança · webhook assinado · liquidação</text><text x="30" y="474" font-family="Arial" font-size="12" fill="#222">tarifa por contrato (não presumida)</text><text x="30" y="490" font-family="Arial" font-size="12" fill="#222">snapshot para conciliação</text><rect x="340" y="60" width="300" height="150" rx="8" fill="#f5f7fb" stroke="#1f3864" stroke-width="1.5"/><text x="350" y="82" font-family="Arial" font-size="14" font-weight="bold" fill="#1f3864">Campanhas e doações</text><text x="350" y="102" font-family="Arial" font-size="12" fill="#222">campaigns (revisão a quatro olhos, KYB)</text><text x="350" y="118" font-family="Arial" font-size="12" fill="#222">donations: estados definidos</text><text x="350" y="134" font-family="Arial" font-size="12" fill="#222">payment_provider_events (idempotente)</text><text x="350" y="150" font-family="Arial" font-size="12" fill="#222">donation_pledges · external_resources</text><text x="350" y="166" font-family="Arial" font-size="12" fill="#222">donation_receipts (não dedutível)</text><rect x="340" y="240" width="300" height="130" rx="8" fill="#eef7ee" stroke="#1f3864" stroke-width="1.5"/><text x="350" y="262" font-family="Arial" font-size="14" font-weight="bold" fill="#1f3864">Razão de doações (partidas dobradas)</text><text x="350" y="282" font-family="Arial" font-size="12" fill="#222">donation_ledger_entries — só inserção</text><text x="350" y="298" font-family="Arial" font-size="12" fill="#222">cada txn soma zero (restrição diferida)</text><text x="350" y="314" font-family="Arial" font-size="12" fill="#222">estorno = lançamento novo</text><text x="350" y="330" font-family="Arial" font-size="12" fill="#222">SEM coluna de saldo</text><rect x="340" y="400" width="300" height="130" rx="8" fill="#fff8e6" stroke="#1f3864" stroke-width="1.5"/><text x="350" y="422" font-family="Arial" font-size="14" font-weight="bold" fill="#1f3864">Conciliação</text><text x="350" y="442" font-family="Arial" font-size="12" fill="#222">reconciliation_runs</text><text x="350" y="458" font-family="Arial" font-size="12" fill="#222">reconciliation_exceptions (9 tipos)</text><text x="350" y="474" font-family="Arial" font-size="12" fill="#222">prioridade · responsável · histórico</text><text x="350" y="490" font-family="Arial" font-size="12" fill="#222">webhook recebido ≠ conciliado</text><rect x="700" y="60" width="300" height="170" rx="8" fill="#eef2ff" stroke="#1f3864" stroke-width="1.5"/><text x="710" y="82" font-family="Arial" font-size="14" font-weight="bold" fill="#1f3864">Remuneração da plataforma</text><text x="710" y="102" font-family="Arial" font-size="12" fill="#222">remuneration_obligations: calculada →</text><text x="710" y="118" font-family="Arial" font-size="12" fill="#222">devida → faturada → cobrada → recebida</text><text x="710" y="134" font-family="Arial" font-size="12" fill="#222">→ liquidada (desvios: estornada, vencida,</text><text x="710" y="150" font-family="Arial" font-size="12" fill="#222">disputa, dispensada, isenta)</text><text x="710" y="166" font-family="Arial" font-size="12" fill="#222">valor congelado · histórico só-inserção</text><rect x="700" y="260" width="300" height="120" rx="8" fill="#eef2ff" stroke="#1f3864" stroke-width="1.5"/><text x="710" y="282" font-family="Arial" font-size="14" font-weight="bold" fill="#1f3864">Gratuito até gerar valor</text><text x="710" y="302" font-family="Arial" font-size="12" fill="#222">monetization_policy_versions</text><text x="710" y="318" font-family="Arial" font-size="12" fill="#222">franquia · aviso prévio · mínimo · teto</text><text x="710" y="334" font-family="Arial" font-size="12" fill="#222">remuneration_notices (registro)</text><text x="710" y="350" font-family="Arial" font-size="12" fill="#222">recurso público: isento salvo instrumento</text><rect x="700" y="410" width="300" height="120" rx="8" fill="#f5f7fb" stroke="#1f3864" stroke-width="1.5"/><text x="710" y="432" font-family="Arial" font-size="14" font-weight="bold" fill="#1f3864">Cobrança própria (existente)</text><text x="710" y="452" font-family="Arial" font-size="12" fill="#222">platform_charges kind=operation</text><text x="710" y="468" font-family="Arial" font-size="12" fill="#222">invoices · payout_transfers</text><text x="710" y="484" font-family="Arial" font-size="12" fill="#222">monetization_rules + cartas legais</text><text x="710" y="500" font-family="Arial" font-size="12" fill="#222">fee_rule_versions (congeladas)</text><rect x="1030" y="60" width="130" height="470" rx="8" fill="#f3f3f3" stroke="#1f3864" stroke-width="1.5"/><text x="1040" y="82" font-family="Arial" font-size="14" font-weight="bold" fill="#1f3864">Trilha</text><text x="1040" y="102" font-family="Arial" font-size="12" fill="#222">audit_log</text><text x="1040" y="118" font-family="Arial" font-size="12" fill="#222">categorias:</text><text x="1040" y="134" font-family="Arial" font-size="12" fill="#222">donation</text><text x="1040" y="150" font-family="Arial" font-size="12" fill="#222">remuneration</text><text x="1040" y="166" font-family="Arial" font-size="12" fill="#222">reconciliation</text><text x="1040" y="182" font-family="Arial" font-size="12" fill="#222">pledge</text><text x="1040" y="198" font-family="Arial" font-size="12" fill="#222">external_resource</text><text x="1040" y="214" font-family="Arial" font-size="12" fill="#222"></text><text x="1040" y="230" font-family="Arial" font-size="12" fill="#222">RLS em tudo</text><text x="1040" y="246" font-family="Arial" font-size="12" fill="#222">GRANT mínimo</text><line x1="280" y1="125" x2="340" y2="125" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="314.0" y="121.0" font-family="Arial" font-size="11" fill="#444">doa</text><line x1="280" y1="465" x2="340" y2="465" stroke="#444" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6,4"/><text x="314.0" y="461.0" font-family="Arial" font-size="11" fill="#444">snapshot</text><path d="M 280 440 L 310 440 L 310 200 L 340 200" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="296" y="330" font-family="Arial" font-size="11" fill="#444" transform="rotate(-90 296 330)">webhook assinado</text><line x1="490" y1="210" x2="490" y2="240" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="494.0" y="221.0" font-family="Arial" font-size="11" fill="#444">confirmação</text><line x1="490" y1="370" x2="490" y2="400" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><line x1="640" y1="125" x2="700" y2="125" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="641" y="112" font-family="Arial" font-size="11" fill="#444">taxa</text><text x="641" y="145" font-family="Arial" font-size="11" fill="#444">CALCULADA</text><line x1="850" y1="230" x2="850" y2="260" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="854.0" y="241.0" font-family="Arial" font-size="11" fill="#444">gatilho auditável</text><line x1="850" y1="380" x2="850" y2="410" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="854.0" y="391.0" font-family="Arial" font-size="11" fill="#444">só se DEVIDA</text><line x1="640" y1="300" x2="700" y2="300" stroke="#444" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6,4"/><text x="641" y="288" font-family="Arial" font-size="11" fill="#444">liquidado</text><text x="641" y="318" font-family="Arial" font-size="11" fill="#444">em 12 meses</text><path d="M 150 360 L 150 560 L 850 560 L 850 530" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6,4"/><text x="380" y="553" font-family="Arial" font-size="11" fill="#444">organização paga a fatura própria da plataforma à parte (nunca desconto da doação)</text><text x="20" y="600" font-family="Arial" font-size="12" fill="#444">Linhas tracejadas: informação/consulta. Linhas cheias: evento que muda estado. Nenhuma seta leva dinheiro para dentro da plataforma (ADR-284).</text><text x="20" y="620" font-family="Arial" font-size="12" fill="#444">Regras do catálogo: todas INATIVAS. O banco recusa ativar o motor success_fee (ADR-022): fundo (4 %) e reserva (1,5 %) nunca viram receita da plataforma.</text></svg>