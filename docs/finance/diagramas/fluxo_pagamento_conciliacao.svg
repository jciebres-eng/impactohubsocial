<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><rect width="1280" height="760" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#444"/></marker></defs><text x="20" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#1f3864">Fluxo de pagamento, estados e conciliação (v0.34.0)</text><rect x="10" y="50" width="140" height="34" rx="6" fill="#1f3864"/><text x="80" y="72" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Doador</text><line x1="80" y1="84" x2="80" y2="720" stroke="#bbb" stroke-dasharray="4,4"/><rect x="230" y="50" width="140" height="34" rx="6" fill="#1f3864"/><text x="300" y="72" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Página pública</text><line x1="300" y1="84" x2="300" y2="720" stroke="#bbb" stroke-dasharray="4,4"/><rect x="450" y="50" width="140" height="34" rx="6" fill="#1f3864"/><text x="520" y="72" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">API IMPACTO</text><line x1="520" y1="84" x2="520" y2="720" stroke="#bbb" stroke-dasharray="4,4"/><rect x="670" y="50" width="140" height="34" rx="6" fill="#1f3864"/><text x="740" y="72" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Provedor</text><line x1="740" y1="84" x2="740" y2="720" stroke="#bbb" stroke-dasharray="4,4"/><rect x="890" y="50" width="140" height="34" rx="6" fill="#1f3864"/><text x="960" y="72" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Razão / obrigação</text><line x1="960" y1="84" x2="960" y2="720" stroke="#bbb" stroke-dasharray="4,4"/><rect x="1050" y="50" width="140" height="34" rx="6" fill="#1f3864"/><text x="1120" y="72" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">Conciliação</text><line x1="1120" y1="84" x2="1120" y2="720" stroke="#bbb" stroke-dasharray="4,4"/><line x1="80" y1="120" x2="300" y2="120" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="88" y="114" font-family="Arial" font-size="11" fill="#222">abre /campanha/slug (QR → página, nunca chave Pix)</text><line x1="300" y1="150" x2="520" y2="150" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="308" y="144" font-family="Arial" font-size="11" fill="#222">POST donate (valor, idempotency_key)</text><line x1="520" y1="180" x2="740" y2="180" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="528" y="174" font-family="Arial" font-size="11" fill="#222">create_charge</text><line x1="740" y1="210" x2="520" y2="210" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="528" y="204" font-family="Arial" font-size="11" fill="#222">charge_id, Pix copia-e-cola  → donation = awaiting_payment</text><line x1="80" y1="250" x2="740" y2="250" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="88" y="244" font-family="Arial" font-size="11" fill="#222">paga ao PROVEDOR (fora da plataforma)</text><line x1="740" y1="290" x2="520" y2="290" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="528" y="284" font-family="Arial" font-size="11" fill="#222">webhook assinado: payment.confirmed (event_id, amount)</text><line x1="520" y1="320" x2="960" y2="320" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="528" y="314" font-family="Arial" font-size="11" fill="#222">idempotência · valor conferido → confirmed · partidas dobradas · obrigação CALCULADA</text><line x1="740" y1="360" x2="520" y2="360" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="528" y="354" font-family="Arial" font-size="11" fill="#222">webhook: payment.settled / PAYMENT_RECEIVED</text><line x1="520" y1="390" x2="960" y2="390" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="528" y="384" font-family="Arial" font-size="11" fill="#222">settled_at (liquidado ≠ confirmado) — base da franquia</text><line x1="740" y1="430" x2="520" y2="430" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="528" y="424" font-family="Arial" font-size="11" fill="#222">webhook: partially_refunded / refunded / chargeback</text><line x1="520" y1="460" x2="960" y2="460" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="528" y="454" font-family="Arial" font-size="11" fill="#222">reversão como lançamento novo; comprovante anulado; obrigação → estornada</text><line x1="1120" y1="510" x2="740" y2="510" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="748" y="504" font-family="Arial" font-size="11" fill="#222">snapshot do provedor (API real) / eventos assinados (sandbox)</text><line x1="1120" y1="540" x2="960" y2="540" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="968" y="534" font-family="Arial" font-size="11" fill="#222">confronta razão × sistema × provedor</text><line x1="960" y1="570" x2="1120" y2="570" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="968" y="564" font-family="Arial" font-size="11" fill="#222">bate → reconciled; diverge → exceção tipada</text><line x1="960" y1="620" x2="520" y2="620" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="528" y="614" font-family="Arial" font-size="11" fill="#222">evaluate(org): regra ativa? franquia? aviso ≥ 30 d? público autorizado? teto?  → DEVIDA ou motivo</text><line x1="520" y1="660" x2="960" y2="660" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="528" y="654" font-family="Arial" font-size="11" fill="#222">invoice → platform_charge (manual/sandbox) → cobrada → recebida (referência) → liquidada (finance.approve)</text><text x="20" y="700" font-family="Arial" font-size="12" fill="#444">Nada do que a organização deve condiciona a prestação de contas, a exportação ou a página pública (ADR-381). Tudo o que muda estado fica na trilha.</text><text x="20" y="718" font-family="Arial" font-size="12" fill="#444">Provedor real: BLOQUEADO (contrato, KYB, parecer). O sandbox reproduz os eventos com assinatura HMAC e nunca movimenta dinheiro.</text></svg>