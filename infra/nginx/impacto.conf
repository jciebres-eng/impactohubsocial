# Proxy reverso TLS de referência (Nginx). Ajuste server_name e certificados (ex.: Let's Encrypt).
#
# `server_tokens off` e `proxy_hide_header Server` existem porque o smoke de publicação da v0.18.1
# conferiu o cabeçalho `Server`: anunciar a pilha e a versão não é vulnerabilidade por si, mas
# entrega de graça o que sondar. O contêiner já sobe com `--no-server-header`; aqui é a segunda
# camada, para o caso de alguém subir a aplicação sem essa opção.
server_tokens off;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
server {
  listen 443 ssl http2;
  server_name SEU-DOMINIO;
  ssl_certificate     /etc/letsencrypt/live/SEU-DOMINIO/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/SEU-DOMINIO/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 16m;
  location /metrics { deny all; }
  location / {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # TRUST_PROXY_HEADERS=true somente atrás deste proxy
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    proxy_hide_header Server;
    add_header Server impacto always;
  }
}
server { listen 80; server_name SEU-DOMINIO; return 301 https://$host$request_uri; }
